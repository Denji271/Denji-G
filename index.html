<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Szójátékok</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%236aaa64'/%3E%3Ctext x='50' y='71' font-size='62' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="hub">
    <div class="hub-head">
      <h1>Szójátékok</h1>
      <div class="lang-switch"></div>
    </div>

    <div class="cards">
      <a class="card" href="wordle.html">
        <div class="card-icon" aria-hidden="true">
          <span class="mini-tile" style="background:var(--correct)">W</span>
          <span class="mini-tile" style="background:var(--absent)">O</span>
          <span class="mini-tile" style="background:var(--present)">R</span>
          <span class="mini-tile" style="background:var(--correct)">D</span>
          <span class="mini-tile" style="background:var(--absent)">L</span>
        </div>
        <h2>Wordle</h2>
      </a>

      <a class="card" href="bee.html">
        <div class="card-icon" aria-hidden="true">
          <span class="mini-hex">B</span>
          <span class="mini-hex center">E</span>
          <span class="mini-hex">E</span>
        </div>
        <h2>Spelling Bee</h2>
      </a>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>WG.setupLangSwitch(WG.getLang());</script>
</body>
</html>
